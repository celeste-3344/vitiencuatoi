name: Build & Deploy (Sổ Chi Tiêu)

# Chạy mỗi khi push lên nhánh main, hoặc bấm chạy tay trong tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nếu push liên tiếp nhiều lần, chỉ giữ lại lần deploy mới nhất đang chạy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- 1) Gom file cần deploy vào thư mục dist/ ----
      - name: Chuẩn bị thư mục build (dist)
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/css
          cp -r js dist/js

      # ---- 2) Điền Firebase config thật từ GitHub Secrets (KHÔNG lộ ra log) ----
      - name: Điền Firebase config từ GitHub Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: node .github/scripts/inject-config.js

      # ---- 3) Cài công cụ minify (chỉ cài tạm cho lần build này, không commit vào repo) ----
      - name: Cài công cụ minify
        run: npm install --no-save html-minifier-terser terser clean-css-cli

      # ---- 4) Minify từng file .js (giữ cú pháp ES module vì code dùng import/export) ----
      - name: Minify JavaScript
        run: |
          for f in dist/js/*.js; do
            npx terser "$f" --compress --mangle --module -o "$f.tmp" && mv "$f.tmp" "$f"
            echo "Đã minify: $f"
          done

      # ---- 5) Minify CSS ----
      - name: Minify CSS
        run: npx cleancss -o dist/css/style.css dist/css/style.css

      # ---- 6) Minify HTML thành 1 dòng (đây là bước tạo hiệu ứng "xem mã nguồn thấy 1 dòng dài") ----
      - name: Minify HTML
        run: >
          npx html-minifier-terser
          --collapse-whitespace --remove-comments --remove-redundant-attributes
          --minify-css true --minify-js true
          -o dist/index.html dist/index.html

      # ---- 7) Deploy dist/ lên GitHub Pages ----
      - name: Upload artifact cho GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
